const cj=x=>JSON.stringify(x,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((o,q)=>(o[q]=v[q],o),{}):v);
const strip=s=>{const o={...s};delete o.ab;return o},core=s=>{const o=strip(s);delete o.mt;return cj(o)};
const COLS=["pockets","tx","inc","sv","tu","bills","goals","inst"],SCL=["base","cyc","anchor","income","rates","open","salOn"];
function snapOf(s){const o={};COLS.forEach(c=>{o[c]={};(s[c]||[]).forEach(x=>o[c][x.id]=cj(x))});SCL.forEach(k=>o[k]=cj(s[k]));return o}
const loadBase=()=>{try{return JSON.parse(localStorage.getItem(SYB)||"null")}catch(e){return null}},saveBase=b=>{try{localStorage.setItem(SYB,JSON.stringify(b))}catch(e){}};
const pristine=s=>!s.tx.length&&!s.inc.length&&!(s.sv||[]).length&&!(s.tu||[]).length&&!s.bills.length&&!s.goals.length&&!s.inst.length;
/* three-way merge: local (L), cloud (R) and what both agreed on last time (B) */
function merge(L,R,B){const out={...L};
COLS.forEach(c=>{const l={},r={},b=B[c]||{};(L[c]||[]).forEach(x=>l[x.id]=x);(R[c]||[]).forEach(x=>r[x.id]=x);
const ids=[...new Set([...(L[c]||[]).map(x=>x.id),...(R[c]||[]).map(x=>x.id)])];
out[c]=ids.map(id=>{const a=l[id],z=r[id],aj=a&&cj(a),zj=z&&cj(z),bj=b[id];
if(aj===zj||zj===bj)return a;if(aj===bj)return z;if(!a)return z;if(!z)return a;return (z.u||0)>(a.u||0)?z:a}).filter(Boolean)});
SCL.forEach(k=>{const aj=cj(L[k]),zj=cj(R[k]),bj=B[k];if(aj===zj||zj===bj)return;if(aj===bj){out[k]=R[k];return}out[k]=(R.mt||0)>(L.mt||0)?R[k]:L[k]});
["ro","salDone","rv"].forEach(k=>{out[k]=Object.assign({},R[k]||{},L[k]||{})});out.mt=Math.max(L.mt||0,R.mt||0);return out}
/* first sync on a device that already has data: treat same-named pockets as the same pocket */
function dedupe(L,R){const nm=x=>String(x.n||"").trim().toLowerCase(),rm={},map={},L2={...L,pockets:[]};(R.pockets||[]).forEach(p=>rm[nm(p)]=p.id);
(L.pockets||[]).forEach(p=>{const rid=rm[nm(p)];if(rid&&!(R.pockets||[]).some(q=>q.id===p.id))map[p.id]=rid;else L2.pockets.push(p)});
L2.tx=(L.tx||[]).map(t=>map[t.p]?{...t,p:map[t.p]}:t);L2.bills=(L.bills||[]).map(b=>map[b.pk]?{...b,pk:map[b.pk]}:b);return L2}
/* sign-in */
const gisReady=()=>!!(window.google&&google.accounts&&google.accounts.oauth2);
function loadGis(){return new Promise((ok,no)=>{if(gisReady())return ok();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=()=>ok();s.onerror=()=>no(new Error("offline"));document.head.appendChild(s)})}
function redirectAuth(){const st=uid()+uid();try{localStorage.setItem("undiyal_oas",st)}catch(e){}location.href="https://accounts.google.com/o/oauth2/v2/auth?"+new URLSearchParams({client_id:GCID,redirect_uri:location.origin+location.pathname.replace(/[^/]*$/,''),response_type:"token",scope:GSCOPE,state:st,include_granted_scopes:"true"})}
let ORPH=null;
function oauthReturn(){const hs=location.hash;if(hs.indexOf("access_token=")<0&&hs.indexOf("error=")<0)return;const q=new URLSearchParams(hs.slice(1));let st=null;try{st=localStorage.getItem("undiyal_oas")}catch(e){}history.replaceState(null,"",location.pathname+location.search);
if(q.get("error")){SYS.err="Google said: "+q.get("error");sySave();return}
if(q.get("state")&&q.get("state")===st){SYS.tok=q.get("access_token");SYS.exp=Date.now()+(+q.get("expires_in")||3600)*1000;SYS.on=true;SYS.has=1;SYS.err="";sySave()}
else ORPH=q.get("access_token")}
async function getToken(interactive){if(SYS.tok&&SYS.exp>Date.now()+60000)return SYS.tok;if(!interactive)throw new Error("auth");
if(navigator.standalone===true&&!SYS.alt){redirectAuth();return new Promise(()=>{})}
if(!gisReady())await loadGis();
return new Promise((ok,no)=>{const tc=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:GSCOPE,callback:r=>{if(!r||r.error)return no(new Error((r&&r.error)||"denied"));SYS.tok=r.access_token;SYS.exp=Date.now()+(+r.expires_in||3600)*1000;SYS.has=1;sySave();ok(SYS.tok)},error_callback:e=>no(new Error((e&&e.type)||"popup"))});tc.requestAccessToken({prompt:SYS.has?"":"select_account"})})}
async function gfetch(url,opt){opt=opt||{};const t=await getToken(false),r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});if(r.status===401){SYS.tok=null;SYS.exp=0;sySave();throw new Error("auth")}if(!r.ok)throw new Error("http "+r.status);return r}
async function findFile(){const r=await gfetch(DRV+"?spaces=appDataFolder&pageSize=10&fields="+encodeURIComponent("files(id,modifiedTime)")+"&q="+encodeURIComponent("name='"+SYF+"'")),j=await r.json();return j.files&&j.files[0]}

async function createFile(data){const b="u"+uid()+uid();await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:"--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:SYF,parents:["appDataFolder"],mimeType:"application/json"})+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+data+"\r\n--"+b+"--"})}
const updateFile=(id,data)=>gfetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body:data});
/* sync */

function rerender(){const y=window.scrollY;render();scrollTo(0,y)}
async function syncNow(interactive){if(NATIVE||!GCID||!SYS.on)return;if(syBusy){syAgain=true;return}syBusy=true;setSy("busy");
try{await getToken(interactive);
if(!SYS.who){try{const j=await (await gfetch("https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)")).json();SYS.who=(j.user&&j.user.emailAddress)||"";sySave()}catch(e){}}
const base=loadBase();let ok=false;
for(let i=0;i<3&&!ok;i++){
const f=await findFile();let remote=null;
if(f){remote=parseRemote(await dlFile(f.id))}
let merged=S;
if(remote){if(!base&&pristine(S))merged={...remote,ab:S.ab};else merged=merge(base?S:dedupe(S,remote),remote,base||{})}
if(core(merged)!==core(S)){await snapPut("Before cloud sync");S=merged;norm();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}rerender()}
if(!remote||core(S)!==core(remote)){const d=JSON.stringify(strip(S));if(f)await updateFile(f.id,d);else await createFile(d);
/* verify nobody overwrote us in the meantime; if so, merge again with their version */
const f2=await findFile(),r2=f2?parseRemote(await dlFile(f2.id)):null;ok=!!r2&&core(r2)===core(S)}
else ok=true}
if(!ok)throw new Error("Sync collided with another device, will retry");
saveBase(snapOf(S));SYS.last=Date.now();SYS.err="";sySave();setSy("ok")}
catch(e){const m=String(e&&e.message||e);if(!["auth","offline"].includes(m)&&!(e instanceof TypeError)){SYS.err=m;sySave()}setSy(["auth","popup_closed","popup_failed_to_open","access_denied","denied","popup"].includes(m)?"auth":(e instanceof TypeError||m==="offline")?"offline":"err")}
finally{syBusy=false;if(syAgain){syAgain=false;setTimeout(()=>syncNow(false),300)}}}

/* ---------- local backups (web app): Files-app backup + reminders, automatic in-app snapshots ---------- */
const FBK="undiyal_fb",SNK="undiyal_snap",FBP={daily:864e5,weekly:6048e5,monthly:2592e6};let snT;

const fbDue=()=>!NATIVE&&FBP[FB.mode]&&Date.now()-FB.last>=FBP[FB.mode]&&(S.tx.length+S.inc.length)>0;
const fbBanner=()=>fbDue()?`<div class="c" id="fbb" style="cursor:pointer" onclick="fbNow()">💾 Time to save a backup to your Files app – tap here</div>`:"";

const snapDb=()=>new Promise((ok,no)=>{try{const r=indexedDB.open("undiyal-snaps",1);r.onupgradeneeded=()=>r.result.createObjectStore("s",{keyPath:"t"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});

async function snapPut(note){const d=JSON.stringify(strip(S)),t=Date.now();if(NATIVE)return;try{const db=await snapDb();await idbDo(db,"readwrite",s=>s.put({t,note,d}));const ks=(await idbDo(db,"readonly",s=>s.getAllKeys())).sort((x,y)=>y-x);for(const k of ks.slice(30))await idbDo(db,"readwrite",s=>s.delete(k));localStorage.setItem(SNK,String(t))}catch(e){}}
